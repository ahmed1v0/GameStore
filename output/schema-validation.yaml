openapi: 3.0.3
info:
  title: Game Store API
  version: 1.0.0
  description: Authenticated catalog browsing and single-product purchasing.
paths:
  /api/v1/admin/users:
    get:
      operationId: v1_admin_users_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/admin/users/{id}:
    patch:
      operationId: v1_admin_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '403':
          description: Administrator role required
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/admin/users/invitations:
    post:
      operationId: v1_admin_users_invitations_create
      description: Creates an application account and sends a one-time password-setup
        invitation. The generated bootstrap password is never returned or shared.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminInvite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '403':
          description: Administrator role required
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/change-password:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
      description: Browser clients require X-CSRFToken from GET /api/v1/auth/csrf.
        Swagger UI injects it automatically.
  /api/v1/auth/csrf:
    get:
      operationId: v1_auth_csrf_retrieve
      summary: Initialize CSRF protection
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/forgot-password:
    post:
      operationId: v1_auth_forgot_password_create
      description: |-
        Returns an account-independent acknowledgment. Requires X-CSRFToken. Verification requests do not send email when EMAIL_VERIFICATION_ENABLED is false.

        Browser clients require X-CSRFToken from GET /api/v1/auth/csrf. Swagger UI injects it automatically.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: |-
        Returns an access token and user. Sets an HttpOnly refresh cookie. Requires X-CSRFToken.

        Browser clients require X-CSRFToken from GET /api/v1/auth/csrf. Swagger UI injects it automatically.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Requires X-CSRFToken. Revokes the refresh cookie; access expires within five minutes.

        Browser clients require X-CSRFToken from GET /api/v1/auth/csrf. Swagger UI injects it automatically.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
      parameters:
      - name: game_store_refresh
        in: cookie
        required: false
        schema:
          type: string
        description: HttpOnly cookie set by login/refresh; absent from JSON.
  /api/v1/auth/me:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Requires refresh cookie and X-CSRFToken. Rotates and blacklists the old refresh token.

        Browser clients require X-CSRFToken from GET /api/v1/auth/csrf. Swagger UI injects it automatically.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
      parameters:
      - name: game_store_refresh
        in: cookie
        required: true
        schema:
          type: string
        description: HttpOnly cookie set by login/refresh; absent from JSON.
  /api/v1/auth/resend-verification:
    post:
      operationId: v1_auth_resend_verification_create
      description: |-
        Returns an account-independent acknowledgment. Requires X-CSRFToken. Verification requests do not send email when EMAIL_VERIFICATION_ENABLED is false.

        Browser clients require X-CSRFToken from GET /api/v1/auth/csrf. Swagger UI injects it automatically.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Email'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Email'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/reset-password:
    post:
      operationId: v1_auth_reset_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
      description: Browser clients require X-CSRFToken from GET /api/v1/auth/csrf.
        Swagger UI injects it automatically.
  /api/v1/auth/signup:
    post:
      operationId: v1_auth_signup_create
      description: |-
        Creates an ordinary user. Verification is controlled by EMAIL_VERIFICATION_ENABLED.

        Browser clients require X-CSRFToken from GET /api/v1/auth/csrf. Swagger UI injects it automatically.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
  /api/v1/auth/verify-email:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Token'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid fields or expired/consumed link. Returns detail or
            field errors.
        '401':
          description: Invalid credentials. Unverified login returns code=email_unverified.
        '403':
          description: CSRF validation failed or administrator permission is required.
        '429':
          description: Too many attempts. Retry-After gives the delay in seconds.
      description: Browser clients require X-CSRFToken from GET /api/v1/auth/csrf.
        Swagger UI injects it automatically.
  /api/v1/orders:
    post:
      operationId: v1_orders_create
      description: Create an order for the authenticated user and snapshot the product
        values used by the receipt. Requires a UUID Idempotency-Key scoped to the
        authenticated user. Repeating the same key and product returns the original
        receipt and 201, without creating an order. Reusing a key for another product
        returns 409. Keys do not expire. Idempotency-Replayed is true for replays
        and false for new orders.
      summary: Purchase one product
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Generate once per purchase intent; reuse on every retry.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
              description: Whether the original receipt was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
          description: ''
        '400':
          description: The purchase request is malformed.
        '401':
          description: A valid access token is required.
        '404':
          description: The product does not exist.
        '409':
          description: The key was already used for a different product.
  /api/v1/orders/{id}:
    get:
      operationId: v1_orders_retrieve
      description: Return a receipt owned by the authenticated user.
      summary: Retrieve an order receipt
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
          description: ''
        '401':
          description: A valid access token is required.
        '404':
          description: The order does not exist or belongs to another user.
  /api/v1/products:
    get:
      operationId: v1_products_list
      description: Return a deterministic, paginated product list with optional regional
        filtering.
      summary: List products
      parameters:
      - in: query
        name: location
        schema:
          enum:
          - JO
          - SA
          type: string
          minLength: 1
        description: |-
          * `JO` - Jordan
          * `SA` - Saudi Arabia
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
        '400':
          description: Invalid page, page size, or location.
        '401':
          description: A valid access token is required.
    post:
      operationId: v1_products_create
      description: Return a deterministic, paginated product list with optional regional
        filtering.
      summary: List products
      parameters:
      - in: query
        name: location
        schema:
          enum:
          - JO
          - SA
          type: string
          minLength: 1
        description: |-
          * `JO` - Jordan
          * `SA` - Saudi Arabia
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
        '400':
          description: Invalid page, page size, or location.
        '401':
          description: A valid access token is required.
  /api/v1/products/{id}:
    get:
      operationId: v1_products_retrieve
      summary: Retrieve a product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '401':
          description: A valid access token is required.
        '404':
          description: The product does not exist.
    put:
      operationId: v1_products_update
      summary: Retrieve a product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '401':
          description: A valid access token is required.
        '404':
          description: The product does not exist.
    patch:
      operationId: v1_products_partial_update
      summary: Retrieve a product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '401':
          description: A valid access token is required.
        '404':
          description: The product does not exist.
components:
  schemas:
    AdminInvite:
      type: object
      properties:
        username:
          type: string
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: user
      required:
      - email
      - username
    ChangePassword:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          maxLength: 128
        current_password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - current_password
      - password
      - password_confirm
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
        email_verification_enabled:
          type: boolean
      required:
      - csrfToken
      - email_verification_enabled
    Email:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    OrderReceipt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_id:
          type: integer
          readOnly: true
        product_title:
          type: string
          maxLength: 255
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        product_location:
          $ref: '#/components/schemas/ProductLocationEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product_id
      - product_location
      - product_title
      - unit_price
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedAdminUpdate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
    PatchedProductWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        location:
          $ref: '#/components/schemas/ProductLocationEnum'
        created_at:
