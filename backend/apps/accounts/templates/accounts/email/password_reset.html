<!doctype html>
<html lang="en">
  <body style="margin:0;background:#0b0f18;color:#f8fafc;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <h1 style="font-size:26px">Reset your Game Store password</h1>
      <p>Hello {{ username }},</p>
      <p>Use the button below to choose a new password.</p>
      <p style="margin:32px 0"><a href="{{ action_url }}" style="background:#73e2a7;color:#08120e;padding:14px 20px;border-radius:10px;text-decoration:none;font-weight:bold">Reset password</a></p>
      <p style="color:#a8b3c5;font-size:14px">This link expires in one hour and can be used once. If you did not request a reset, ignore this email.</p>
    </div>
  </body>
</html>
