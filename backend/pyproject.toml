[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "game-store-api"
version = "0.1.0"
description = "REST API for the game store technical assessment"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<1",
    "django-cors-headers>=4.7,<5",
    "dj-database-url>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
